    - endpoints: [ "plane2-rail2:ethernet-1/10/1", "plane2-spine1:ethernet-1/2/1" ]
    - endpoints: [ "plane2-rail3:ethernet-1/10/1", "plane2-spine1:ethernet-1/3/1" ]
    - endpoints: [ "plane2-rail4:ethernet-1/10/1", "plane2-spine1:ethernet-1/4/1" ]
    - endpoints: [ "plane2-rail1:ethernet-1/10/2", "plane2-spine2:ethernet-1/1/1" ]
    - endpoints: [ "plane2-rail2:ethernet-1/10/2", "plane2-spine2:ethernet-1/2/1" ]
    - endpoints: [ "plane2-rail3:ethernet-1/10/2", "plane2-spine2:ethernet-1/3/1" ]
    - endpoints: [ "plane2-rail4:ethernet-1/10/2", "plane2-spine2:ethernet-1/4/1" ]
    - endpoints: [ "gpu-server2:eth1", "plane1-rail1:ethernet-1/1/2" ]
    - endpoints: [ "gpu-server2:eth2", "plane1-rail2:ethernet-1/1/2" ]
    - endpoints: [ "gpu-server2:eth3", "plane1-rail3:ethernet-1/1/2" ]
    - endpoints: [ "gpu-server2:eth4", "plane1-rail4:ethernet-1/1/2" ]
    - endpoints: [ "gpu-server2:eth10", "plane2-rail1:ethernet-1/1/2" ]
    - endpoints: [ "gpu-server2:eth20", "plane2-rail2:ethernet-1/1/2" ]
    - endpoints: [ "gpu-server2:eth30", "plane2-rail3:ethernet-1/1/2" ]
    - endpoints: [ "gpu-server2:eth40", "plane2-rail4:ethernet-1/1/2" ]
