    - { color: "red", level: 0 }
    - { color: "green", level: 1 }
  thresholds-traffic: &thresholds-traffic
    - { color: "gray", level: 0 }
    - { color: "green", level: 199999 }
    - { color: "yellow", level: 500000 }
    - { color: "orange", level: 1000000 }
    - { color: "red", level: 5000000 }
  thresholds-rate-label: &thresholds-rate-label
    - { color: "white", level: 0 }
  label-config: &label-config
    separator: "replace"
    units: "bps"
    decimalPoints: 1
    valueMappings:
      - { valueMax: 199999, text: "\u200B" }
